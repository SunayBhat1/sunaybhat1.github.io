{{- define "main" }}

<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- with .Description }}
  <div class="post-description">{{ . | markdownify }}</div>
  {{- end }}
</header>

{{- with .Content }}
<div class="post-content project-intro">{{ . }}</div>
{{- end }}

{{- range .RegularPages }}
<article class="post-entry">
  <header class="entry-header">
    <h2 class="entry-hint-parent">{{ .Title }}</h2>
  </header>
  <div class="entry-content">
    <p>{{ .Summary | plainify | htmlUnescape }}</p>
  </div>
  <a class="entry-link" aria-label="Read about {{ .Title | plainify }}" href="{{ .RelPermalink }}"></a>
</article>
{{- end }}

{{- end }}
