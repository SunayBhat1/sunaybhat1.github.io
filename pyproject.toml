[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfpllm"
version = "0.1.0"
description = "A frozen-packet LLM experiment for CFP committee rankings"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "requests>=2.31,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
cfpllm = "cfpllm.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
